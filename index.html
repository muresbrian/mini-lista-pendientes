<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis pendientes</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f4f4f5;
    margin: 0;
    padding: 24px 16px;
    color: #18181b;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
  }
  h1 { margin: 0 0 4px; font-size: 24px; }
  p.sub { margin: 0 0 20px; color: #71717a; font-size: 14px; }

  form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 10px 12px;
    border: 1px solid #d4d4d8;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus {
    border-color: #18181b;
  }
  select.select-priority {
    padding: 10px 12px;
    border: 1px solid #d4d4d8;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: #18181b;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }
  select.select-priority:focus {
    border-color: #18181b;
  }
  button.add {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #18181b;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.add:hover {
    background: #27272a;
  }

  /* Filtros */
  .filters-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid #f4f4f5;
  }
  .filter-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid #e4e4e7;
    background: #f4f4f5;
    border-radius: 20px;
    font-size: 13px;
    color: #52525b;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover {
    background: #e4e4e7;
    color: #18181b;
  }
  .filter-btn.active {
    background: #18181b;
    color: #fff;
    border-color: #18181b;
  }
  .badge-count {
    background: rgba(0, 0, 0, 0.08);
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .filter-btn.active .badge-count {
    background: rgba(255, 255, 255, 0.25);
    color: #fff;
  }
  .secondary-filters {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: #71717a;
    flex-wrap: wrap;
    gap: 8px;
  }
  .priority-filter-box {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .priority-filter-box select {
    padding: 4px 8px;
    border: 1px solid #d4d4d8;
    border-radius: 6px;
    font-size: 13px;
    background: #fff;
    color: #18181b;
    cursor: pointer;
  }

  /* Lista de tareas */
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 6px;
    border-top: 1px solid #f4f4f5;
    transition: background 0.15s;
  }
  li:first-child { border-top: none; }
  li:hover {
    background: #fafafa;
    border-radius: 8px;
  }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #18181b;
    flex-shrink: 0;
  }
  li .task-content {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  li .task-text {
    flex: 1;
    word-break: break-word;
    font-size: 15px;
    cursor: pointer;
  }
  li.done .task-text {
    text-decoration: line-through;
    color: #a1a1aa;
  }

  /* Edición en línea */
  .edit-input {
    flex: 1;
    min-width: 0;
    padding: 6px 10px;
    border: 1px solid #18181b;
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(24, 24, 27, 0.1);
  }

  /* Etiquetas de prioridad */
  .tag-priority {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tag-alta {
    background: #fee2e2;
    color: #dc2626;
    border: 1px solid #fecaca;
  }
  .tag-media {
    background: #fef3c7;
    color: #d97706;
    border: 1px solid #fde68a;
  }
  .tag-baja {
    background: #e0f2fe;
    color: #0284c7;
    border: 1px solid #bae6fd;
  }
  li.done .tag-priority {
    opacity: 0.6;
    filter: grayscale(40%);
  }

  /* Botones de acción */
  .task-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }
  .btn-action {
    border: none;
    background: none;
    color: #a1a1aa;
    font-size: 15px;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-action.edit:hover {
    color: #2563eb;
    background: #eff6ff;
  }
  .btn-action.del {
    font-size: 19px;
  }
  .btn-action.del:hover {
    color: #ef4444;
    background: #fee2e2;
  }

  .footer-bar {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid #f4f4f5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #71717a;
    font-size: 13px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .btn-clear-done {
    background: none;
    border: none;
    color: #71717a;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }
  .btn-clear-done:hover {
    color: #dc2626;
  }
  .empty {
    color: #a1a1aa;
    padding: 24px 8px;
    text-align: center;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>Mis pendientes</h1>
    <p class="sub">Primer proyecto en conjunto: Kurt + Antigravity</p>

    <form id="form">
      <input id="input" type="text" placeholder="Escribe un pendiente..." autocomplete="off">
      <select id="priority" class="select-priority" title="Prioridad de la tarea">
        <option value="baja">Baja</option>
        <option value="media" selected>Media</option>
        <option value="alta">Alta</option>
      </select>
      <button class="add" type="submit">Agregar</button>
    </form>

    <div class="filters-container">
      <div class="filter-tabs">
        <button type="button" class="filter-btn active" data-filter="todas">
          Todas <span class="badge-count" id="count-all">0</span>
        </button>
        <button type="button" class="filter-btn" data-filter="pendientes">
          Pendientes <span class="badge-count" id="count-pending">0</span>
        </button>
        <button type="button" class="filter-btn" data-filter="completadas">
          Completadas <span class="badge-count" id="count-done">0</span>
        </button>
      </div>

      <div class="secondary-filters">
        <div class="priority-filter-box">
          <label for="filter-priority">Prioridad:</label>
          <select id="filter-priority">
            <option value="todas">Todas las prioridades</option>
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>
      </div>
    </div>

    <ul id="list"></ul>

    <div class="footer-bar">
      <div id="counter"></div>
      <button id="clear-done-btn" class="btn-clear-done" type="button" style="display: none;">
        Limpiar completadas
      </button>
    </div>
  </div>

<script>
  const KEY = "pendientes";
  const list = document.getElementById("list");
  const input = document.getElementById("input");
  const prioritySelect = document.getElementById("priority");
  const counter = document.getElementById("counter");
  const clearDoneBtn = document.getElementById("clear-done-btn");
  const priorityFilterSelect = document.getElementById("filter-priority");
  const statusFilterBtns = document.querySelectorAll(".filter-btn");

  const countAll = document.getElementById("count-all");
  const countPending = document.getElementById("count-pending");
  const countDone = document.getElementById("count-done");

  let currentStatusFilter = "todas";
  let currentPriorityFilter = "todas";
  let editingTaskId = null;

  // Cargar tareas asegurando retrocompatibilidad
  let rawTasks = JSON.parse(localStorage.getItem(KEY) || "[]");
  let tasks = rawTasks.map((t) => ({
    id: t.id || Date.now() + "-" + Math.random().toString(36).substr(2, 9),
    text: t.text || "",
    done: Boolean(t.done),
    priority: t.priority || "media"
  }));

  function save() {
    localStorage.setItem(KEY, JSON.stringify(tasks));
  }

  function updateCounters() {
    const total = tasks.length;
    const done = tasks.filter((t) => t.done).length;
    const pending = total - done;

    countAll.textContent = total;
    countPending.textContent = pending;
    countDone.textContent = done;

    counter.textContent = total
      ? `${done} de ${total} completadas`
      : "";

    clearDoneBtn.style.display = done > 0 ? "inline" : "none";
  }

  function getFilteredTasks() {
    return tasks.filter((task) => {
      // Filtro por estado
      if (currentStatusFilter === "pendientes" && task.done) return false;
      if (currentStatusFilter === "completadas" && !task.done) return false;

      // Filtro por prioridad
      if (currentPriorityFilter !== "todas" && task.priority !== currentPriorityFilter) {
        return false;
      }

      return true;
    });
  }

  function render() {
    updateCounters();
    list.innerHTML = "";

    const filtered = getFilteredTasks();

    if (tasks.length === 0) {
      list.innerHTML = '<li class="empty">No tienes pendientes. ¡Agrega el primero arriba!</li>';
      return;
    }

    if (filtered.length === 0) {
      list.innerHTML = '<li class="empty">No hay pendientes que coincidan con los filtros seleccionados.</li>';
      return;
    }

    filtered.forEach((task) => {
      const li = document.createElement("li");
      if (task.done) li.className = "done";

      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = task.done;
      check.title = task.done ? "Marcar como pendiente" : "Marcar como completada";
      check.addEventListener("change", () => {
        const target = tasks.find((t) => t.id === task.id);
        if (target) {
          target.done = check.checked;
          save();
          render();
        }
      });

      const content = document.createElement("div");
      content.className = "task-content";

      const tag = document.createElement("span");
      tag.className = `tag-priority tag-${task.priority || "media"}`;
      tag.textContent = task.priority ? task.priority.charAt(0).toUpperCase() + task.priority.slice(1) : "Media";

      if (editingTaskId === task.id) {
        // Modo edición en línea
        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.className = "edit-input";
        editInput.value = task.text;

        let isCanceling = false;

        function commitEdit() {
          if (isCanceling) return;
          const newText = editInput.value.trim();
          if (newText) {
            const target = tasks.find((t) => t.id === task.id);
            if (target) {
              target.text = newText;
              save();
            }
          }
          editingTaskId = null;
          render();
        }

        function cancelEdit() {
          isCanceling = true;
          editingTaskId = null;
          render();
        }

        editInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            commitEdit();
          } else if (e.key === "Escape") {
            e.preventDefault();
            cancelEdit();
          }
        });

        editInput.addEventListener("blur", () => {
          commitEdit();
        });

        content.append(editInput, tag);

        setTimeout(() => {
          editInput.focus();
          editInput.select();
        }, 0);
      } else {
        // Modo visualización normal
        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = task.text;
        span.title = "Doble clic para editar";
        span.addEventListener("dblclick", () => {
          editingTaskId = task.id;
          render();
        });

        content.append(span, tag);
      }

      const actions = document.createElement("div");
      actions.className = "task-actions";

      const editBtn = document.createElement("button");
      editBtn.className = "btn-action edit";
      editBtn.innerHTML = "&#9998;";
      editBtn.title = "Editar pendiente";
      editBtn.addEventListener("click", () => {
        editingTaskId = task.id;
        render();
      });

      const del = document.createElement("button");
      del.className = "btn-action del";
      del.innerHTML = "&times;";
      del.title = "Eliminar pendiente";
      del.addEventListener("click", () => {
        tasks = tasks.filter((t) => t.id !== task.id);
        if (editingTaskId === task.id) editingTaskId = null;
        save();
        render();
      });

      actions.append(editBtn, del);

      li.append(check, content, actions);
      list.appendChild(li);
    });
  }

  // Manejo de envío de formulario
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    tasks.push({
      id: Date.now() + "-" + Math.random().toString(36).substr(2, 9),
      text,
      done: false,
      priority: prioritySelect.value || "media"
    });

    input.value = "";
    prioritySelect.value = "media";
    save();
    render();
    input.focus();
  });

  // Filtros de estado (Todas / Pendientes / Completadas)
  statusFilterBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      statusFilterBtns.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentStatusFilter = btn.dataset.filter;
      render();
    });
  });

  // Filtro de prioridad (Todas / Alta / Media / Baja)
  priorityFilterSelect.addEventListener("change", (e) => {
    currentPriorityFilter = e.target.value;
    render();
  });

  // Botón para limpiar completadas
  clearDoneBtn.addEventListener("click", () => {
    if (confirm("¿Estás seguro de que deseas eliminar todas las tareas completadas?")) {
      tasks = tasks.filter((t) => !t.done);
      save();
      render();
    }
  });

  render();
</script>
</body>
</html>
